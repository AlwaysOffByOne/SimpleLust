name: Validate addon

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Parse Lua files
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -n1 luac5.1 -p

      - name: Validate package references and whitespace
        run: python3 scripts/validate_package.py
